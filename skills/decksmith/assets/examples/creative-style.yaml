name: quiet-editorial
intent: 落ち着きと精密さがあり、機械的ではなく丁寧に作られた印象
keywords:
  - エディトリアル
  - 控えめ
  - 広い余白
palette_direction: 温かみのある中立色の背景に、鮮やかな青を1色だけ使用
imagery:
  medium: エディトリアル写真または簡潔なコンセプトイラスト
  lighting: 柔らかな方向性のある光
  composition: 非対称で、十分なネガティブスペースを確保
  avoid:
    - 画像内の文字
    - ロゴ
    - 光沢感の強い作り込まれたストック写真
texture: 控えめで触感を感じさせる質感
