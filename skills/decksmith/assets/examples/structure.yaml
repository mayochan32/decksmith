slides:
  - id: cover
    layout: cover
    title: DeckSmith
    subtitle: 題材・構成・スタイルを独立して制御するPowerPoint生成エージェント

  - id: inputs
    layout: split
    title: 3つの独立した入力
    left:
      heading: 内容に関する判断
      items:
        - 題材で目的と対象者を定める
        - 構成で話の流れを定める
    right:
      heading: デザインに関する判断
      items:
        - 参考画像を再利用可能な規則に変換する
        - 必要なスライドだけ画像で補強する

  - id: pipeline
    layout: bullets
    title: 再現可能な制作パイプライン
    bullets:
      - 依頼内容を4つのYAMLへ記録する
      - 意味を加える画像だけを生成する
      - 編集可能なスライドを作り、全プレビューを検査する

  - id: close
    layout: closing
    title: 意図に合わせてPowerPointを仕立てる
    subtitle: 個人でも会社でも使える実用的なワークフロー
