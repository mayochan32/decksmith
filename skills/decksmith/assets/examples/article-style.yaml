Style: Electric Blueprint
Overall Design Settings:
  Tone: "知的で未来的。高いコントラストを保ちながら、情報は整理して見せる。"
  Key Visual:
    Motif: "暗い設計図面に発光する情報レイヤーを重ねる。"
    Decoration: "細いシアンの罫線と、ごく小さな技術ラベルを使用する。"
  Color Palette:
    Background: "#0B1020 (Deep Navy)"
    Surface: "#151D33 (Blue Black)"
    Main Text: "#F4F7FF (Soft White)"
    Accent: "#52E5FF (Electric Cyan)"
    Secondary Accent: "#8B7CFF (Violet)"
  Photography Style:
    - "暗い背景に被写体を明瞭に配置する。"
    - "画像内へ文字やロゴを生成しない。"
    - "主題の周囲に文字を置ける余白を残す。"
  Typography:
    Display Heading: "Massive condensed sans-serif. Strong contrast in scale."
    Body: "Clean sans-serif with generous line spacing."
  Common Layout Rules:
    Alignment: "Asymmetrical grid with clear left alignment."
    Lines: "Use thin cyan frame lines to divide major regions."
    Whitespace: "Keep generous negative space around each message."

Layout Variations (Catalog):
  - Type: "Mega Title Cover"
    Applies To:
      - cover
    Design: "A massive title occupies most of the canvas. A cyan field anchors the lower edge."
  - Type: "Dual Split Comparison"
    Applies To:
      - split
    Design: "Two flat color fields create a direct comparison without card-like containers."
  - Type: "Terminal Divider List"
    Applies To:
      - bullets
    Design: "Each item resembles a terminal entry and is separated by a thin cyan line."
  - Type: "Impact Statement"
    Applies To:
      - statement
    Design: "One large statement fills the center with minimal supporting decoration."
  - Type: "Final Conclusion"
    Applies To:
      - closing
    Design: "A solid accent field carries one concise final message."

Points to Note When Applying the Design:
  - "装飾よりも可読性を優先する。"
  - "本文を小さくしすぎず、1枚のメッセージを絞る。"
